name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PokerStudy src/poker_study.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokerStudy-Windows
          path: dist/PokerStudy.exe
          if-no-files-found: error
